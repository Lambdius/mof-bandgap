[project]
name = "mof-bandgap"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.6",
    "playwright>=1.48,<1.60",
    "camoufox>=0.4",
    "browserforge>=1.2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "minio>=7.2",
]

[project.scripts]
mof-bandgap = "mof_bandgap.main:main"

[dependency-groups]
dev = ["ruff>=0.8", "mypy>=1.13", "pytest>=8.3", "types-beautifulsoup4>=4.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mof_bandgap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["mof_bandgap"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
