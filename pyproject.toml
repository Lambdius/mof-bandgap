[project]
name = "mof-bandgap"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic-settings>=2.6"]

[project.scripts]
mof-bandgap = "mof_bandgap.main:main"

[dependency-groups]
dev = ["ruff>=0.8", "mypy>=1.13", "pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mof_bandgap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["mof_bandgap"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
